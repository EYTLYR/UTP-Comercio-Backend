# Configuración común. Los perfiles están más abajo:
#   dev   (por defecto) PostgreSQL con Docker Compose Support (compose.yaml).
#   local dev sin Docker: PostgreSQL ya instalado o el repo UTP-Comercio-Data-Base.
#   prod  todo por variables de entorno.
# Los secretos (Neon PostgreSQL y S3) van en .env, que no se sube a git (ver .env.example).
spring:
  config:
    import: optional:file:.env[.properties]
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:false}
  application:
    name: utp-comercio-backend
  profiles:
    # .env se importa como properties: mapear explícitamente la clave de entorno.
    active: ${SPRING_PROFILES_ACTIVE:dev}
    default: dev
    group:
      local: dev
  datasource:
    hikari:
      connection-timeout: 15000
      initialization-fail-timeout: 60000
      data-source-properties:
        connectTimeout: 10
        tcpKeepAlive: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: America/Lima
  flyway:
    # DNS o arranque en frío de la base: reintentar sin omitir migraciones.
    connect-retries: ${DB_CONNECT_RETRIES:5}
    connect-retries-interval: ${DB_CONNECT_RETRY_INTERVAL:5s}
    jdbc-properties:
      connectTimeout: 10
      tcpKeepAlive: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

logging:
  pattern:
    correlation: "[%X{cid:-}] "

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

nearby:
  jwt-secret: ${NEARBY_JWT_SECRET}
  access-token-minutes: 60
  refresh-token-days: 30
  otp:
    length: 6
    expiry-minutes: 5
    max-attempts: 5
    max-requests-per-hour: 5
  notifications:
    provider: ${NEARBY_NOTIFICATIONS_PROVIDER:log}
  sms:
    # console = solo log; http (o gateway) = microservicio SMS por HTTP con 2 reintentos (HttpSmsGateway).
    provider: ${NEARBY_SMS_PROVIDER:console}
    inbound-token: ${NEARBY_SMS_INBOUND_TOKEN:}
    gateway:
      # Microservicio SMS compartido del equipo (túnel de James). Solo hace falta la clave en .env.
      url: ${NEARBY_SMS_GATEWAY_URL:https://fflx84lw-3000.brs.devtunnels.ms}
      api-key: ${NEARBY_SMS_GATEWAY_API_KEY:}
  emergency:
    auto-activate-sos-count: 5
    auto-activate-window-minutes: 10
  prevention:
    cluster-radius-m: 150
    cluster-window-hours: 6
  ai:
    provider: ${NEARBY_AI_PROVIDER:rules}
    model: ${NEARBY_AI_MODEL:claude-haiku-5-5}
    api-key: ${ANTHROPIC_API_KEY:}
    # NEARBY_AI_PROVIDER=gemini: foto de riesgo y micrófono con Gemini (fallback a reglas si falla).
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${NEARBY_GEMINI_MODEL:gemini-2.5-flash}
      timeout-seconds: ${NEARBY_GEMINI_TIMEOUT_SECONDS:8}
  storage:
    provider: ${NEARBY_STORAGE_PROVIDER:s3}
    bucket: ${NEARBY_S3_BUCKET:}
    endpoint: ${AWS_ENDPOINT_URL_S3:}
    region: ${AWS_REGION:us-east-2}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    prefix: ${NEARBY_S3_PREFIX:risk-photos/}
  cors:
    allowed-origin-patterns: ${NEARBY_CORS_ORIGINS:}
  # Municipalidad (ADMIN) y brigada (BRIGADIST) por celular, separados por coma. Se aplican al ingresar.
  roles:
    admin-phones: ${NEARBY_ADMIN_PHONES:}
    brigade-phones: ${NEARBY_BRIGADE_PHONES:}

---
spring:
  config:
    activate:
      on-profile: dev
nearby:
  jwt-secret: ${NEARBY_JWT_SECRET:dev-only-nearby-secret-0123456789-abcdef}
  otp:
    # Vacío = código aleatorio en cada pedido (llega por SMS o, sin SMS reales, se ve en el log).
    # Solo para una demo sin SMS se puede fijar: NEARBY_OTP_DEV_CODE=123456 en .env.
    dev-fixed-code: ${NEARBY_OTP_DEV_CODE:}
  sms:
    inbound-token: ${NEARBY_SMS_INBOUND_TOKEN:dev-sms-token}
  cors:
    allowed-origin-patterns: http://localhost:*,http://127.0.0.1:*

---
spring:
  config:
    activate:
      on-profile: local
  docker:
    compose:
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/utp_comercio_db}
    username: ${DB_USER:utp_comercio_user}
    password: ${DB_PASSWORD:}
  # Neon: la app usa el pooler y Flyway la conexión directa (DB_MIGRATION_URL), como recomienda Neon.
  flyway:
    url: ${DB_MIGRATION_URL:${DB_URL:jdbc:postgresql://localhost:5435/utp_comercio_db}}
    user: ${DB_USER:utp_comercio_user}
    password: ${DB_PASSWORD:}

---
spring:
  config:
    activate:
      on-profile: prod
  docker:
    compose:
      enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    url: ${DB_MIGRATION_URL:${DB_URL}}
    user: ${DB_USER}
    password: ${DB_PASSWORD}
# Sin nearby.otp.dev-fixed-code: en prod los códigos SMS siempre son aleatorios y nunca se devuelven
# en la respuesta (AuthService lo ignora con prod aunque llegue por variable de entorno).
springdoc:
  swagger-ui:
    enabled: ${NEARBY_SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${NEARBY_SWAGGER_ENABLED:false}
