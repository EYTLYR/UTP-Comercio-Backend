# Las pruebas no heredan perfiles prod/local del .env del desarrollador.
spring.profiles.active=dev
# Solo pruebas: sin indexado ni planes de rescate en segundo plano, para que no se mezclen entre pruebas.
# Las pruebas de la FASE 9 llaman al indexador y al plan de rescate directamente.
nearby.ai.index-on-events=false
nearby.ai.auto-rescue-plan=false
# Los límites de peticiones se prueban en RateLimiterTest; aquí se apagan (muchas pruebas usan la misma IP).
nearby.rate-limit.enabled=false
# Fotos en memoria: las pruebas no suben nada a S3.
nearby.storage.provider=memory
# Valores fijos: las pruebas no dependen del .env (que tiene secretos y proveedores reales).
nearby.sms.inbound-token=dev-sms-token
nearby.ai.provider=rules
nearby.sms.provider=console
nearby.notifications.provider=log
