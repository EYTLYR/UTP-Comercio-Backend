# Despliegue: cargar nearby-backend:server con docker load y ejecutar docker compose up -d.
# No requiere código fuente, Dockerfile, .env ni acceso a un registro.
services:
  app:
    image: nearby-backend:server
    pull_policy: never
    restart: unless-stopped
    init: true
    environment:
      PORT: '8080'
      DOCKER_COMPOSE_ENABLED: 'false'
    ports:
      - '8080:8080'
