# Producción (VPS, Railway o Render): docker compose -f compose.prod.yaml --env-file .env up -d --build
# Copia .env.example a .env y cambia los secretos antes de levantar.
services:
  db:
    image: 'postgres:16-alpine'
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nearby}
      POSTGRES_USER: ${DB_USER:-nearby}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      TZ: America/Lima
    volumes:
      - 'nearby-prod-data:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-nearby} -d ${DB_NAME:-nearby}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-nearby}
      DB_USER: ${DB_USER:-nearby}
      DB_PASSWORD: ${DB_PASSWORD}
      NEARBY_JWT_SECRET: ${NEARBY_JWT_SECRET:?Define NEARBY_JWT_SECRET (32+ caracteres) en .env}
      NEARBY_SMS_INBOUND_TOKEN: ${NEARBY_SMS_INBOUND_TOKEN:?Define NEARBY_SMS_INBOUND_TOKEN en .env}
      NEARBY_CORS_ORIGINS: ${NEARBY_CORS_ORIGINS:-}
      NEARBY_AI_PROVIDER: ${NEARBY_AI_PROVIDER:-rules}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NEARBY_OTP_DEV_CODE: ${NEARBY_OTP_DEV_CODE:-}
      NEARBY_SWAGGER_ENABLED: ${NEARBY_SWAGGER_ENABLED:-false}
    ports:
      - '${PORT:-8080}:8080'
    volumes:
      - 'nearby-uploads:/app/uploads'

volumes:
  nearby-prod-data:
  nearby-uploads:
